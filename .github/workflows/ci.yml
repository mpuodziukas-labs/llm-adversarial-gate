name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests + Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # No third-party dependencies - stdlib only.
        # pytest is the only install needed.
        run: pip install pytest

      - name: Build corpus
        run: python3 build_corpus.py

      - name: Run pytest
        run: python3 -m pytest tests/ -v --tb=short

      - name: Run evaluation
        # evaluate.py exits 0 when there is no unexpected miss or false positive.
        # Rows marked known_gap are documented and do not fail the run.
        run: python3 evaluate.py
