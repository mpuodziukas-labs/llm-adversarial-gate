name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests + Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # No third-party dependencies — stdlib only.
        # pytest is the only install needed.
        run: pip install pytest

      - name: Build corpus
        run: python3 build_corpus.py

      - name: Run pytest
        run: python3 -m pytest tests/ -v --tb=short

      - name: Run evaluation
        # evaluate.py exits 0 if all adversarial prompts are blocked (0 FN).
        # CI fails if any adversarial prompt slips through.
        run: python3 evaluate.py
